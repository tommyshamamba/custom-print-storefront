apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront-api
  labels:
    app: storefront-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront-api
  template:
    metadata:
      labels:
        app: storefront-api
    spec:
      containers:
        - name: api
          image: storefront-api:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront-api
spec:
  selector:
    app: storefront-api
  ports:
    - port: 80
      targetPort: 8080
